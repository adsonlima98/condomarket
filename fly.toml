# Configuracao do Fly.io para o CondoMarket
# Documentacao: https://fly.io/docs/reference/configuration/

app = "condomarket"          # <-- troque pelo nome do seu app no Fly.io
primary_region = "gru"       # gru = Sao Paulo (mais proximo dos usuarios)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Variaveis sensiveis NAO ficam aqui — use: flyctl secrets set NOME=valor

[http_service]
  internal_port = 8080
  force_https = true          # redireciona HTTP → HTTPS automaticamente
  auto_stop_machines = true   # para a VM quando sem trafego (economiza)
  auto_start_machines = true  # reinicia automaticamente quando receber request
  min_machines_running = 0    # 0 = pode dormir; coloque 1 para resposta instantanea

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Volume para PDFs e banco SQLite (se nao usar PostgreSQL)
[[mounts]]
  source = "condomarket_data"   # nome do volume no Fly.io
  destination = "/data"         # caminho dentro do container
  initial_size = "1gb"

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    port = 8080
    timeout = "5s"
    type = "http"
